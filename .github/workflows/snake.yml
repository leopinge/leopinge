name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Generate custom snake SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}
        run: |
          node -e "
          const https = require('https');
          const fs = require('fs');
          const user = process.env.GITHUB_USER;
          const token = process.env.GITHUB_TOKEN;

          function req(url) {
            return new Promise((resolve, reject) => {
              https.get(url, {headers:{'Authorization':'token '+token,'User-Agent':'snake-gen','Accept':'application/vnd.github.v3+json'}}, res => {
                let d='';
                res.on('data',c=>d+=c);
                res.on('end',()=>{try{resolve(JSON.parse(d))}catch(e){resolve([])}});
              }).on('error',reject);
            });
          }

          async function main() {
            const repos = await req('https://api.github.com/users/'+user+'/repos?per_page=100&sort=updated');
            const byDate = {};
            for(const repo of (Array.isArray(repos)?repos:[]).slice(0,30)){
              try{
                const commits = await req('https://api.github.com/repos/'+user+'/'+repo.name+'/commits?author='+user+'&per_page=100');
                if(Array.isArray(commits)){
                  for(const c of commits){
                    const date = c.commit&&c.commit.author&&c.commit.author.date?c.commit.author.date.substring(0,10):null;
                    if(date) byDate[date]=(byDate[date]||0)+1;
                  }
                }
              }catch(e){}
            }
            console.log('Commits by date:', JSON.stringify(byDate));
            const W=52,D=7,SZ=12,GAP=2,STEP=SZ+GAP,PL=20,PT=20;
            const width=PL+W*STEP+10, height=PT+D*STEP+10;
            const today=new Date(); today.setHours(0,0,0,0);
            const start=new Date(today);
            start.setDate(start.getDate()-start.getDay()-(W-1)*7);
            const grid=[], foods=[];
            for(let w=0;w<W;w++){
              grid[w]=[];
              for(let d=0;d<D;d++){
                const dt=new Date(start);
                dt.setDate(start.getDate()+w*7+d);
                const ds=dt.toISOString().substring(0,10);
                const cnt=byDate[ds]||0;
                grid[w][d]=cnt;
                if(cnt>0) foods.push({w,d,cnt});
              }
            }
            console.log('Total food cells:', foods.length);

            function color(cnt,dark){
              if(!cnt) return dark?'#161b22':'#ebedf0';
              if(cnt<=2) return dark?'#0e4429':'#9be9a8';
              if(cnt<=5) return dark?'#006d32':'#40c463';
              if(cnt<=10) return dark?'#26a641':'#30a14e';
              return dark?'#39d353':'#216e39';
            }

            for(const dark of [false,true]){
              const bg=dark?'#0d1117':'#ffffff';
              const ec=dark?'#161b22':'#ebedf0';
              const sc=dark?'#58a6ff':'#6e40c9';
              const shc=dark?'#79c0ff':'#8957e5';
              const path=[];
              for(let w=0;w<W;w++){
                if(w%2===0){for(let d=0;d<D;d++)path.push({w,d});}
                else{for(let d=D-1;d>=0;d--)path.push({w,d});}
              }
              const fi=[];
              for(let i=0;i<path.length;i++){
                const c=path[i];
                if(grid[c.w][c.d]>0) fi.push(i);
              }
              const speed=10, total=path.length, dur=(total/speed).toFixed(1);
              let svg=['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+width+' '+height+'" width="'+width+'" height="'+height+'" style="background:'+bg+'">'];
              svg.push('<defs><style>');
              for(let k=0;k<fi.length;k++){
                const idx=fi[k];
                const pct=((idx/total)*100).toFixed(2);
                svg.push('.f'+k+'{animation:ef'+k+' '+dur+'s linear infinite}');
                svg.push('@keyframes ef'+k+'{0%,'+Math.max(0,pct-0.5).toFixed(2)+'%{opacity:1}'+pct+'%,100%{opacity:0}}');
              }
              svg.push('</style></defs>');
              for(let w=0;w<W;w++){
                for(let d=0;d<D;d++){
                  const x=PL+w*STEP, y=PT+d*STEP, cnt=grid[w][d];
                  if(cnt>0){
                    const k=foods.findIndex(f=>f.w===w&&f.d===d);
                    svg.push('<rect class="f'+k+'" x="'+x+'" y="'+y+'" width="'+SZ+'" height="'+SZ+'" rx="3" fill="'+color(cnt,dark)+'"/>');
                  } else {
                    svg.push('<rect x="'+x+'" y="'+y+'" width="'+SZ+'" height="'+SZ+'" rx="3" fill="'+ec+'"/>');
                  }
                }
              }
              let pd='';
              for(let i=0;i<path.length;i++){
                const c=path[i];
                const cx=PL+c.w*STEP+SZ/2, cy=PT+c.d*STEP+SZ/2;
                pd+=(i===0?'M':'L')+' '+cx+' '+cy+' ';
              }
              svg.push('<path id="sp" d="'+pd+'" fill="none" stroke="none"/>');
              svg.push('<circle r="6" fill="'+shc+'"><animateMotion dur="'+dur+'s" repeatCount="indefinite" calcMode="linear"><mpath href="#sp"/></animateMotion></circle>');
              for(let s=1;s<=3;s++){
                const del=(-(s*1.2/speed)).toFixed(3);
                svg.push('<circle r="'+(6-s)+'" fill="'+sc+'" opacity="'+(1-s*0.2).toFixed(1)+'"><animateMotion dur="'+dur+'s" begin="'+del+'s" repeatCount="indefinite" calcMode="linear"><mpath href="#sp"/></animateMotion></circle>');
              }
              svg.push('</svg>');
              const fn=dark?'github-contribution-grid-snake-dark.svg':'github-contribution-grid-snake.svg';
              fs.mkdirSync('dist',{recursive:true});
              fs.writeFileSync('dist/'+fn,svg.join('\n'));
              console.log('Generated',fn,'foods='+foods.length);
            }
          }
          main().catch(e=>{console.error(e);process.exit(1)});
          "

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
